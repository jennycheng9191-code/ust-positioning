<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>部位與波動追蹤</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2312101A'/><path d='M5 24 L5 16 M12 24 L12 9 M19 24 L19 19 M26 24 L26 6' stroke='%23C9913A' stroke-width='3.4' fill='none' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* 密碼閘門：未解鎖前整頁不顯示（gate.js 驗證通過後移除 .locked） */
  html.locked body > *{visibility:hidden}
  html.locked #gate{visibility:visible}
  #gate{position:fixed;inset:0;z-index:99;background:var(--bg);
    display:flex;align-items:center;justify-content:center;padding:24px}
  #gate form{width:100%;max-width:320px;background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:10px}
  .gate-title{font-size:16px;font-weight:600}
  .gate-sub{font-size:12.5px;color:var(--text3);margin-bottom:4px}
  #gatepw{background:var(--card2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);padding:10px 12px;font-size:15px;min-height:42px;font-family:inherit}
  .btn{background:var(--card2);border:1px solid var(--border);color:var(--text2);
    font-size:13px;padding:9px 14px;border-radius:8px;cursor:pointer;min-height:40px;
    font-family:inherit;display:inline-flex;align-items:center;justify-content:center}
  .btn:hover{color:var(--text);border-color:var(--text3)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn-primary{color:var(--text);border-color:var(--c-asset)}
  /* 資料逾期時「手動更新」要跳出來，不能跟旁邊的狀態方塊長得一樣 */
  .btn-warn{color:var(--warn);border-color:var(--warn)}
  .btn-warn:hover{color:var(--warn);border-color:var(--warn);background:var(--card2)}
  a.btn{text-decoration:none}
  .gate-msg{font-size:12px;color:var(--bear);min-height:16px}
</style>
<script>document.documentElement.className='locked';</script>
</head>
<body>

<header>
  <div>
    <h1>部位與波動追蹤</h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="statusbar" id="status"></div>
</header>

<!-- 資產分頁與合約 chips 包在同一個 sticky 容器裡：
     兩層各自 sticky 會需要把下層的 top 寫死成上層的高度，字級或折行一變就錯位。 -->
<div class="stickybar">
  <div class="assettabs" id="assets"></div>
  <div class="chips" id="chips"></div>
</div>
<div class="switchrow">
  <div class="bases" id="schemes"></div>
  <div class="bases" id="bases"></div>
</div>
<div class="basehint" id="schemehint"></div>

<h2><span class="n">M1</span>部位結構</h2>
<div class="note" id="m1note"></div>
<div class="card" id="m1"></div>

<h2><span class="n">M2</span>本週誰在加倉</h2>
<div class="note" id="m2note"></div>
<div class="card scroll" id="m2"></div>

<h2><span class="n">M3</span>部位極端度</h2>
<div class="note" id="m3note"></div>
<div class="grid2">
  <div class="card" id="m3gauges"></div>
  <div class="card" id="m3chart"></div>
</div>

<h2><span class="n">M4</span>已實現波動</h2>
<div class="note" id="m4note"></div>
<div class="card" id="m4"></div>

<!-- M5 只在 payload 帶了 ratio 的分頁出現（目前是貴金屬）。
     整段連標題一起由 app.js 開關，沒有比價資料的分頁不會留下一個空殼標題。 -->
<section id="m5sec" hidden>
  <h2><span class="n">M5</span><span id="m5title"></span></h2>
  <div class="note" id="m5note"></div>
  <div class="card" id="m5"></div>
</section>

<footer>
  <div id="srcline"></div>
  <div id="srcnotes"></div>
  <div>本頁僅供參考，不構成投資建議。</div>
</footer>

<!-- gate.js 驗證通過後才會載入 assets/app.js -->
<script src="assets/gate.js"></script>
</body>
</html>
